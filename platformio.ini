[platformio]
default_envs = T5-ePaper-S3

[env]
extra_scripts =
    pre:tools/package_firmware.py
    pre:tools/isolate_lilygo_zlib.py
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPNG_MAX_BUFFERED_PIXELS=8192
lib_deps =
    bblanchon/ArduinoJson@7.4.2
    bitbank2/PNGdec@1.1.6

[env:T5-ePaper-S3]
board = T5-ePaper-S3
build_flags =
    ${env.build_flags}
    -DLILYGO_T5_EPD47_S3
lib_deps =
    ${env.lib_deps}
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#50224221fb81a8fcf9068532374b775af84a38d4

[env:seeed-TRMNL-7_5]
board = seeed_xiao_esp32s3
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_port =
monitor_port =
build_flags =
    ${env.build_flags}
    -DGERTY_SEEED_TRMNL=1
lib_deps =
    ${env.lib_deps}
    zinggjm/GxEPD2@1.6.4
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.17.0

[env:guition-JC3248W535]
board = JC3248W535
build_flags =
    ${env.build_flags}
    -DGERTY_GUITION=1
lib_deps =
    ${env.lib_deps}
    moononournation/GFX Library for Arduino@1.4.7

[env:guition-JC4827W543]
board = JC4827W543
build_flags =
    ${env.build_flags}
    -DGERTY_GUITION=1
    -DGERTY_JC4827W543=1
lib_deps =
    ${env.lib_deps}
    moononournation/GFX Library for Arduino@1.4.7

[env:waveshare-ESP32-C6-LCD-1_3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = partitions_c6.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DGERTY_WAVESHARE_C6=1
    -DPNG_MAX_BUFFERED_PIXELS=1922
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
